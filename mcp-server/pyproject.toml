[project]
name = "hydra-mcp"
version = "0.1.0"
description = "An MCP server that answers questions about a hydra household."
requires-python = ">=3.13,<4.0"
dependencies = [
    # v2 of the official SDK. Pinned below 3 because `pip install mcp` now
    # resolves to v2, and v1 was not a rename: the server class, where the
    # transport is configured, and how a tool reports an error all changed.
    "mcp[cli]>=2.0.0,<3.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv"]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "mypy>=2.3.1,<3.0.0",
    "ruff>=0.16.5,<1.0.0",
    "coverage>=7.16.0,<8.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["hydra_mcp"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"
