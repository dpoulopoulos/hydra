services:

  db:
    image: postgres:18
    restart: unless-stopped
    healthcheck:
      # $$ escapes the interpolation so the variable is expanded inside the
      # container, from the environment env_file provides.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - ./.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"

  backend:
    image: reeligion-backend:latest
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - ./.env
    environment:
      # Reach the database and the mail catcher over the compose network,
      # overriding the localhost values used when running outside containers.
      POSTGRES_SERVER: db
      SMTP_HOST: mailcatcher
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
      # For attaching a debugger, see "Using debugpy" in backend/README.md.
      - "5678:5678"
    develop:
      watch:
        # Application code is synced into the running container, which the
        # server's reloader picks up. No rebuild, no restart.
        - action: sync
          path: ./backend/src/app
          target: /app/src/app
        # Dependency changes cannot be synced into an existing environment,
        # so these rebuild the image instead.
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock

  frontend:
    image: hydra-frontend:latest
    build:
      context: ./frontend
      # The last stage of that Dockerfile is the production one, which serves
      # compiled files and reloads nothing. Development wants the dev server.
      target: dev
    depends_on:
      - backend
    environment:
      # The browser talks to Vite, which forwards /api to the backend over the
      # compose network. One origin, so CORS never comes into it.
      VITE_API_TARGET: http://backend:8000
      # Listen on every interface, and poll for changes: writes arriving from
      # outside the container are not reliably reported by inotify.
      VITE_IN_CONTAINER: "true"
    ports:
      - "5173:5173"
    develop:
      watch:
        # Source and the entry HTML are synced into the running container, and
        # Vite's hot reload picks them up. No rebuild, no restart.
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync
          path: ./frontend/public
          target: /app/public
        # Vite restarts itself when its own config changes, so these only need
        # to arrive in the container.
        - action: sync
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: sync
          path: ./frontend/components.json
          target: /app/components.json
        # Dependencies cannot be swapped inside a running install, so these
        # rebuild the image instead. node_modules is deliberately never synced:
        # the image builds it for the container's platform.
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml

  mailcatcher:
    image: schickling/mailcatcher
    restart: unless-stopped
    ports:
      - "1080:1080"
      - "1025:1025"

volumes:
  app-db-data:
