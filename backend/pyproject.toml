[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "sqlmodel>=0.0.42,<1.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "pwdlib[bcrypt]>=0.3.1,<1.0.0",
    "pyjwt>=2.13.0,<3.0.0",
    "alembic>=1.19.1,<2.0.0",
    "tenacity>=9.1.4,<10.0.0",
    "psycopg[binary]>=3.3.5,<4.0.0",
    "emails>=1.1.2,<2.0.0",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "mypy>=2.3.1,<3.0.0",
    "ruff>=0.16.5,<1.0.0",
    "pre-commit>=4.6.2,<5.0.0",
    "coverage>=7.16.0,<8.0.0",
    "debugpy>=1.8.21",
    "httpx2>=2.12.0,<3.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true
