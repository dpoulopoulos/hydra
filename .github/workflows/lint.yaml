name: Lint

on:
  pull_request:

# A new push to a pull request makes the run in progress obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: mypy and ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # Pinned exactly: setup-uv publishes no floating tag above v7.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # Runs mypy and ruff the same way they are run locally, so the two
      # cannot drift. Neither imports the code, so no .env is needed here.
      - name: Lint
        run: bash scripts/lint.sh

  lint-frontend:
    name: eslint and tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # No version here on purpose: the action reads it from the
      # packageManager field in frontend/package.json, so CI and a developer's
      # machine agree. The path is explicit because the action looks in the
      # repository root, which defaults.run.working-directory does not change.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      # Node 24 is what frontend/Dockerfile builds the app with.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same pair `make web-lint` runs. tsc is the check that the pages
      # still agree with the generated API client, and until now it only ran
      # when the production image was built, which is after the merge.
      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck
