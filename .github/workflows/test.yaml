name: Tests

on:
  pull_request:

# A new push to a pull request makes the run in progress obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# .env is not committed, so the job builds one from .env.example. These
# override the "changethis" placeholders in it, which the settings otherwise
# warn about on every import. They are throwaway CI values, not secrets.
env:
  SECRET_KEY: ci-secret-key-not-used-outside-ci
  POSTGRES_PASSWORD: ci-postgres-password
  FIRST_SUPERUSER_PASSWORD: ci-superuser-password

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # Pinned exactly: setup-uv publishes no floating tag above v7.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Create .env
        run: cp .env.example .env
        working-directory: .

      - name: Install dependencies
        run: uv sync --locked

      # The unit tests mock the database session, so no server is needed.
      - name: Run tests
        run: bash scripts/test.sh

  # The tier the unit tests cannot cover: household scoping, the CHECK,
  # RESTRICT and UNIQUE constraints, and the money arithmetic that lives in
  # SQL. It needs a server, so it gets one.
  test-integration:
    name: pytest (integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: app
          # Must match the POSTGRES_PASSWORD set at the workflow level.
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      # Pinned exactly: setup-uv publishes no floating tag above v7.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Create .env
        run: cp .env.example .env
        working-directory: .

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: bash scripts/test-integration.sh

  test-frontend:
    name: vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # No version here on purpose: the action reads it from the
      # packageManager field in frontend/package.json, so CI and a developer's
      # machine agree. The path is explicit because the action looks in the
      # repository root, which defaults.run.working-directory does not change.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      # Node 24 is what frontend/Dockerfile builds the app with.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same command `make web-test-unit` runs. The tests render in jsdom
      # and stand in for the API, so neither a backend nor Docker is needed.
      - name: Run tests
        run: pnpm test
