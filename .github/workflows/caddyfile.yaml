name: Web server

on:
  pull_request:

# A new push to a pull request makes the run in progress obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  caddyfile:
    name: Caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same command `make web-test` runs, and the only thing that checks
      # the production server. It runs frontend/Caddyfile under a real Caddy,
      # which needs the Docker that ubuntu-latest already has, and asks it for
      # the security headers, the client side routing, and the /api and
      # /assets routes the browser calls the backend through. Neither the app
      # nor the backend is built for it: the server configuration is what is
      # under test, so the script serves a stand-in tree of its own and stands
      # a second container in for the backend, and the job stays short.
      #
      # Until now the headers that stand between an injected script and the
      # session token in localStorage were verified only when someone
      # remembered to run this by hand, so an edit that dropped them could
      # reach a deploy with a green CI.
      - name: Check the production server config
        run: bash frontend/scripts/test-caddyfile.sh
