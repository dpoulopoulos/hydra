name: Build

on:
  pull_request:

# A new push to a pull request makes the run in progress obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-frontend:
    name: vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # No version here on purpose: the action reads it from the
      # packageManager field in frontend/package.json, so CI and a developer's
      # machine agree. The path is explicit because the action looks in the
      # repository root, which defaults.run.working-directory does not change.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      # Node 24 is what frontend/Dockerfile builds the app with.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The step frontend/Dockerfile runs to produce the deployed image. Doing
      # it here means a build that does not compile fails on the pull request
      # rather than on the deploy to main. No .env is needed: the app reads
      # its API target at runtime.
      - name: Build
        run: pnpm build
