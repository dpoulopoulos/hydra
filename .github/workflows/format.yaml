name: Format

on:
  pull_request:

# A new push to a pull request makes the run in progress obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # Pinned exactly: setup-uv publishes no floating tag above v7.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # ruff neither imports nor runs the code, so no .env is needed here.
      - name: Check formatting
        run: uv run ruff format --check --diff src scripts
